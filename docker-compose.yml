version: "3.9"

name: ctfoj

volumes:
  pg-data:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  ctfoj-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctfoj}
      POSTGRES_USER: ${POSTGRES_USER:-ctfoj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - ctfoj-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctfoj} -d ${POSTGRES_DB:-ctfoj}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - ctfoj-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ctfoj}
      POSTGRES_USER: ${POSTGRES_USER:-ctfoj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      REDIS_ADDR: redis:6379
      BACKEND_HTTP_ADDR: ":8081"
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-dev-secret-change-me}
      BACKEND_JWT_ACCESS_TTL: ${BACKEND_JWT_ACCESS_TTL:-15m}
      BACKEND_JWT_REFRESH_TTL: ${BACKEND_JWT_REFRESH_TTL:-720h}
      BACKEND_REGISTER_OPEN: ${BACKEND_REGISTER_OPEN:-true}
      BACKEND_STORAGE_DRIVER: local
      BACKEND_STORAGE_LOCAL_DIR: /data/uploads
      BACKEND_RATE_LIMIT_RPM: ${BACKEND_RATE_LIMIT_RPM:-120}
    volumes:
      - uploads:/data/uploads
    expose:
      - "8081"
    networks:
      - ctfoj-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ctfoj-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ctfoj-net
